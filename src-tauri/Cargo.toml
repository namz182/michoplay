[package]
name = "michoplay"
version = "0.1.2"
description = "A private, offline-first desktop music player"
authors = ["MichoPlay contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "michoplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rodio = { version = "0.21.1", features = ["symphonia-all"] }
lofty = "0.25.4"
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tauri-plugin-single-instance = "2"
