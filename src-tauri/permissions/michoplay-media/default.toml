[[permission]]
identifier = "default"
description = "Allows MichoPlay's Android media bridge and event listener."
commands.allow = [
  "chooseMusicFolder",
  "shareText",
  "youtubeSearch",
  "youtubeDownloadsState",
  "youtubeDownloadEnqueue",
  "youtubeDownloadPause",
  "youtubeDownloadResume",
  "youtubeDownloadCancel",
  "youtubeDownloadRemove",
  "takePendingActions",
]

[[permission]]
identifier = "register-listener"
description = "Allows this plugin to register and remove frontend event listeners."
commands.allow = ["register_listener", "registerListener"]
